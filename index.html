<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คำนวณขนาดยา Warfarin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="container">
    <h1>คำนวณขนาดยา Warfarin</h1>
    <form id="dose-form">
      <label for="inr">ค่า INR ล่าสุด:</label>
      <input type="number" step="0.1" id="inr" required />
      <label for="bleeding">มีเลือดออกหรือไม่:</label>
      <select id="bleeding">
        <option value="no">ไม่มี</option>
        <option value="yes">มี</option>
      </select>
      <label for="current-dose">ขนาดยาปัจจุบัน (mg/สัปดาห์):</label>
      <input type="number" step="0.1" id="current-dose" required />
      <button type="submit">คำนวณ</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
